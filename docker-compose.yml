# 用法：
#   1) 仅基础组件：docker compose up -d
#   2) 基础 + 前后端（本地代码/日志/env 挂载）：
#        docker compose --profile app up -d --build
#   3) 环境切换：改项目根 .env 的 ENVIRONMENT=dev|prod|test
#        或临时：ENVIRONMENT=prod docker compose --profile app up -d
#   4) 改 backend/.env.* 或根 .env 后重启生效：
#        docker compose --profile app up -d
#        # 或 docker compose --profile app restart backend task-worker
#   5) 日志：./storage/logs/backend/app.log
#   6) Redis 宿主机端口 6380（避免与本机 Redis5 的 6379 冲突）

services:
  postgres:
    # 默认用预构建 pgvector 镜像，避免本地编译时受 Debian 源网络抖动影响。
    # 如需 zhparser，可改回 build: ./postgres
    image: pgvector/pgvector:pg16
    container_name: llm-wiki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmwiki}
      POSTGRES_DB: ${POSTGRES_DB:-llmwiki}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmwiki}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llm-wiki-net

  redis:
    image: redis:7-alpine
    container_name: llm-wiki-redis
    ports:
      # 宿主机 6380 -> 容器 6379，避免与本机 Redis5(6379) 冲突
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llm-wiki-net

  minio:
    image: minio/minio:latest
    container_name: llm-wiki-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-llmwiki}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-llmwiki123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llm-wiki-net

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-wiki-backend
    environment:
      # 决定 settings 读取哪个 backend/.env.*（dev/prod/test）
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    env_file:
      - ./backend/.env.${ENVIRONMENT:-dev}
    ports:
      - "8008:8008"
    volumes:
      # 本地代码热更新
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # 多环境 env 挂载；改文件后 restart 即按 ENVIRONMENT 重新加载
      - ./backend/.env.dev:/app/.env.dev:ro
      - ./backend/.env.prod:/app/.env.prod:ro
      - ./backend/.env.test:/app/.env.test:ro
      # 日志落到宿主机 ./storage/logs/backend
      - ./storage/logs/backend:/app/logs
    command: >
      sh -c "mkdir -p /app/logs &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8008 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - llm-wiki-net

  task-worker:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-wiki-task-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    env_file:
      - ./backend/.env.${ENVIRONMENT:-dev}
    volumes:
      - ./backend/app:/app/app
      - ./backend/.env.dev:/app/.env.dev:ro
      - ./backend/.env.prod:/app/.env.prod:ro
      - ./backend/.env.test:/app/.env.test:ro
      - ./storage/logs/task-worker:/app/logs
    command: >
      sh -c "mkdir -p /app/logs && dramatiq app.workers.core.tasks --queues critical default --threads 16"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - llm-wiki-net

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-wiki-frontend
    working_dir: /app
    environment:
      VITE_BACKEND_URL: http://backend:8008
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # 使用容器内 node_modules，避免宿主机/容器平台二进制不一致
      - frontend_node_modules:/app/node_modules
      - ./storage/logs/frontend:/app/logs
    command: >
      sh -c "npm install &&
             mkdir -p /app/logs &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    networks:
      - llm-wiki-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:

networks:
  llm-wiki-net:
    driver: bridge
