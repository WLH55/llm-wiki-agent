<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="../tools/force-graph.min.js"></script>
<style>
  :root {
    --bg: #F5F2EB; --fg: #2C3E3A; --muted: #7A8B87;
    --accent: #5B8A72; --accent-light: rgba(91,138,114,0.1);
    --surface: rgba(255,255,255,0.82); --surface-solid: #FDFCFA;
    --border: rgba(0,0,0,0.04); --border-strong: rgba(0,0,0,0.06);
    --shadow: rgba(44,62,58,0.06); --input-bg: rgba(245,242,235,0.6);
    --link-normal: rgba(44,62,58,0.18); --link-active: rgba(44,62,58,0.5);
    --label-bg: rgba(245,242,235,0.8); --label-dim: rgba(44,62,58,0.5);
    --canvas-bg: #F5F2EB;
  }
  [data-theme="dark"] {
    --bg: #0f1117; --fg: #e0e0e0; --muted: rgba(255,255,255,0.35);
    --accent: #4dabf7; --accent-light: rgba(77,171,247,0.1);
    --surface: rgba(22,24,33,0.88); --surface-solid: rgba(18,20,28,0.97);
    --border: rgba(255,255,255,0.06); --border-strong: rgba(255,255,255,0.08);
    --shadow: rgba(0,0,0,0.4); --input-bg: rgba(255,255,255,0.06);
    --link-normal: rgba(255,255,255,0.12); --link-active: rgba(255,255,255,0.6);
    --label-bg: rgba(15,17,23,0.75); --label-dim: rgba(255,255,255,0.5);
    --canvas-bg: #0f1117;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: 'Nunito Sans', sans-serif;
    color: var(--fg); overflow: hidden;
  }
  #graph { width: 100vw; height: 100vh; }
  #controls {
    position: fixed; top: 20px; left: 20px;
    background: var(--surface);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    padding: 22px; border-radius: 16px; z-index: 10; max-width: 250px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px var(--shadow);
    transition: box-shadow 0.3s ease, background 0.3s ease;
  }
  #controls:hover { box-shadow: 0 12px 48px var(--shadow); }
  .controls-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #controls h3 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px;
    color: var(--fg); margin: 0; letter-spacing: -0.02em;
  }
  #theme-toggle {
    background: var(--input-bg); border: 1px solid var(--border-strong);
    color: var(--fg); font-size: 14px; width: 30px; height: 30px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s ease; padding: 0; line-height: 1;
  }
  #theme-toggle:hover { background: var(--accent-light); border-color: var(--accent); }
  #search {
    width: 100%; padding: 9px 13px; margin-bottom: 14px;
    background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 10px;
    font-family: 'Nunito Sans', sans-serif; font-size: 13px; outline: none;
    transition: all 0.2s ease;
  }
  #search:focus {
    border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(91,138,114,0.08);
  }
  [data-theme="dark"] #search:focus { box-shadow: 0 0 0 3px rgba(77,171,247,0.08); }
  #search::placeholder { color: var(--muted); }
  .legend-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; margin: 2px; border-radius: 16px;
    font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--accent-light); border: 1px solid var(--border);
  }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .filter-group {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border-strong);
  }
  .filter-group > label {
    display: block; font-size: 9px; font-weight: 700;
    color: var(--muted); margin-bottom: 7px;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .cb-row {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--fg); margin: 4px 0; cursor: pointer;
    opacity: 0.7;
  }
  .cb-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 15px; height: 15px; border: 1.5px solid var(--muted);
    border-radius: 4px; cursor: pointer; position: relative;
    transition: all 0.15s ease; flex-shrink: 0;
  }
  .cb-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .cb-row input[type="checkbox"]:checked::after {
    content: '\2713'; position: absolute; top: -1px; left: 2px;
    color: white; font-size: 10px; font-weight: 700;
  }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--border-strong); border-radius: 3px; outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg); box-shadow: 0 1px 4px var(--shadow);
  }
  .slider-val { font-size: 11px; color: var(--accent); min-width: 30px; text-align: right; font-weight: 700; }
  #controls > p { margin: 12px 0 0; font-size: 10px; color: var(--muted); line-height: 1.5; }
  #stats {
    position: fixed; top: 20px; right: 20px;
    background: var(--surface);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    padding: 9px 16px; border-radius: 30px;
    font-size: 11px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px var(--shadow); z-index: 10;
    transition: background 0.3s ease;
  }
  #drawer {
    position: fixed; top: 0; right: 0;
    width: clamp(400px, 30vw, 580px); max-width: 100vw; height: 100vh;
    background: var(--surface-solid);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    box-shadow: -12px 0 48px var(--shadow);
    z-index: 20; display: flex; flex-direction: column;
    transform: translateX(100%); opacity: 0; pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
  }
  #drawer.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  #drawer-header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border-strong); }
  #drawer-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  #drawer-title {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 20px; line-height: 1.3; color: var(--fg); margin: 0;
  }
  #drawer-close {
    background: none; border: none; color: var(--muted); font-size: 20px;
    cursor: pointer; padding: 4px; line-height: 1; border-radius: 6px;
    transition: all 0.15s ease;
  }
  #drawer-close:hover { background: var(--accent-light); color: var(--fg); }
  #drawer-meta {
    margin-top: 8px; font-size: 10px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  #drawer-path {
    margin-top: 5px; font-size: 10px; color: var(--muted); opacity: 0.6;
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #drawer-related {
    padding: 14px 24px 0; font-size: 10px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  #drawer-related-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .related-chip {
    background: var(--accent-light); color: var(--accent);
    border: 1px solid rgba(91,138,114,0.15); border-radius: 16px;
    font-size: 11px; font-weight: 600; padding: 4px 10px; cursor: pointer;
    transition: all 0.15s ease; font-family: 'Nunito Sans', sans-serif;
  }
  [data-theme="dark"] .related-chip { border-color: rgba(77,171,247,0.2); }
  .related-chip:hover { background: var(--accent); color: white; }
  #drawer-content { flex: 1; min-height: 0; padding: 18px 24px 24px; overflow: auto; }
  #drawer-markdown { font-size: 13px; line-height: 1.8; color: var(--fg); opacity: 0.8; }
  #drawer-markdown h1, #drawer-markdown h2, #drawer-markdown h3, #drawer-markdown h4 {
    font-family: 'Fraunces', serif; font-weight: 500; color: var(--fg); opacity: 1;
    margin: 1.3em 0 0.4em; line-height: 1.3;
  }
  #drawer-markdown h1 { font-size: 20px; }
  #drawer-markdown h2 { font-size: 16px; }
  #drawer-markdown h3 { font-size: 14px; }
  #drawer-markdown p { margin: 0 0 0.8em; }
  #drawer-markdown ul, #drawer-markdown ol { margin: 0 0 0.8em 1.2em; padding: 0; }
  #drawer-markdown li { margin: 0.2em 0; }
  #drawer-markdown hr { border: 0; border-top: 1px solid var(--border-strong); margin: 1.3em 0; }
  #drawer-markdown blockquote {
    margin: 0 0 0.8em; padding: 0.7em 1em;
    border-left: 3px solid var(--accent);
    background: var(--accent-light); border-radius: 0 10px 10px 0; opacity: 1;
  }
  #drawer-markdown pre {
    margin: 0 0 0.8em; white-space: pre-wrap; word-break: break-word;
    line-height: 1.5; font-size: 11px; background: var(--input-bg);
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #drawer-markdown code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em; background: var(--accent-light);
    padding: 0.1em 0.35em; border-radius: 5px; color: var(--accent);
  }
  #drawer-markdown pre code { background: transparent; padding: 0; color: inherit; border-radius: 0; }
  #drawer-markdown .wikilink { color: var(--accent); font-weight: 600; }
  @media (max-width: 960px) { #drawer { width: 100vw; } }
</style>
</head>
<body>
<div id="controls">
  <div class="controls-top">
    <h3>知识图谱</h3>
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">&#9790;</button>
  </div>
  <input id="search" type="text" placeholder="搜索节点..." oninput="searchNodes(this.value)">
  <div>{legend_items}</div>
  <div class="filter-group">
    <label>关系类型</label>
    <div class="cb-row"><input type="checkbox" id="cb-extracted" checked onchange="rebuild()"> 已提取 ({n_extracted})</div>
    <div class="cb-row"><input type="checkbox" id="cb-inferred" checked onchange="rebuild()"> 推断 ({n_inferred})</div>
    <div class="cb-row"><input type="checkbox" id="cb-ambiguous" onchange="rebuild()"> 模糊 ({n_ambiguous})</div>
  </div>
  <div class="filter-group">
    <label>最低置信度</label>
    <div class="slider-row">
      <input type="range" id="conf-slider" min="0" max="100" value="50" oninput="rebuild()">
      <span class="slider-val" id="conf-val">0.50</span>
    </div>
  </div>
  <p>点击节点查看详情<br>拖拽节点 · 滚轮缩放</p>
</div>
<div id="graph"></div>
<aside id="drawer">
  <div id="drawer-header">
    <div id="drawer-topline">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" onclick="clearSelection()" aria-label="关闭">x</button>
    </div>
    <div id="drawer-meta"></div>
    <div id="drawer-path"></div>
  </div>
  <div id="drawer-related">相关节点<div id="drawer-related-list"></div></div>
  <div id="drawer-content"><div id="drawer-markdown"></div></div>
</aside>
<div id="stats"></div>
<script>
// ── theme ──
let graph = null;
let isDark = localStorage.getItem("graph-theme") === "dark";
function applyTheme() {
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  document.getElementById("theme-toggle").innerHTML = isDark ? "&#9788;" : "&#9790;";
  if(typeof graph !== "undefined" && graph) graph.backgroundColor(getComputedStyle(document.documentElement).getPropertyValue("--canvas-bg").trim());
}
function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem("graph-theme", isDark ? "dark" : "light");
  applyTheme();
  rebuild();
}
applyTheme();

function themeColors() {
  const s = getComputedStyle(document.documentElement);
  return {
    canvasBg: s.getPropertyValue("--canvas-bg").trim(),
    labelBg: s.getPropertyValue("--label-bg").trim(),
    labelDim: s.getPropertyValue("--label-dim").trim(),
    linkNormal: isDark ? "rgba(255,255,255,0.12)" : "rgba(44,62,58,0.15)",
    linkActive: isDark ? "rgba(255,255,255,0.6)" : "rgba(44,62,58,0.5)",
    linkArrow: isDark ? "rgba(255,255,255,0.35)" : "rgba(44,62,58,0.3)",
    particle: isDark ? "rgba(255,255,255,0.5)" : "rgba(91,138,114,0.5)",
    nodeDim: isDark ? 0.2 : 0.3,
    glowDark: isDark,
  };
}

// ── data ──
const rawNodes = {nodes_json};
const rawEdges = {edges_json}.map(e => ({
  ...e,
  id: e.id || `${e.from}->${e.to}:${e.type || "INFERRED"}`,
}));

const nodeMap = new Map(rawNodes.map(n => [n.id, n]));
const searchInput = document.getElementById("search");
const statsEl = document.getElementById("stats");
const controls = {
  extracted: document.getElementById("cb-extracted"),
  inferred: document.getElementById("cb-inferred"),
  ambiguous: document.getElementById("cb-ambiguous"),
  confSlider: document.getElementById("conf-slider"),
  confValue: document.getElementById("conf-val"),
};
let activeNodeId = null;
let searchTerm = "";

function hexToRgb(hex) {
  if (!hex) return [200,200,200];
  const n = hex.replace("#","");
  const v = n.length === 3 ? n.split("").map(c=>c+c).join("") : n;
  const i = parseInt(v, 16);
  return [(i>>16)&255, (i>>8)&255, i&255];
}

// ── markdown ──
function escapeHtml(t) {
  return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function stripFrontmatter(md) { return (md||"").replace(/^---\n[\s\S]*?\n---\n?/,""); }
function renderInline(text) {
  let h = escapeHtml(text);
  h = h.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return h;
}
function renderMarkdown(md) {
  const lines = stripFrontmatter(md).split(/\r?\n/);
  const out = [];
  let para = [], lt = null, li = [], ql = [], inCode = false, cl = [];
  function fp() { if(para.length) { out.push("<p>"+renderInline(para.join(" "))+"</p>"); para=[]; } }
  function fl() { if(lt&&li.length) { out.push("<"+lt+">"+li.map(i=>"<li>"+renderInline(i)+"</li>").join("")+"</"+lt+">"); lt=null; li=[]; } }
  function fq() { if(ql.length) { out.push("<blockquote>"+ql.map(l=>renderInline(l)).join("<br>")+"</blockquote>"); ql=[]; } }
  function fc() { out.push("<pre><code>"+escapeHtml(cl.join("\n"))+"</code></pre>"); cl=[]; }
  for(const raw of lines) {
    const line = raw.replace(/\t/g,"    "), t = line.trim();
    if(t.startsWith("```")) { fp();fl();fq(); if(inCode){fc();inCode=false}else inCode=true; continue; }
    if(inCode){cl.push(raw);continue;}
    if(!t){fp();fl();fq();continue;}
    const hm=t.match(/^(#{1,6})\s+(.+)$/);
    if(hm){fp();fl();fq(); out.push("<h"+hm[1].length+">"+renderInline(hm[2])+"</h"+hm[1].length+">"); continue;}
    if(/^(-{3,}|\*{3,})$/.test(t)){fp();fl();fq();out.push("<hr>");continue;}
    const qm=t.match(/^>\s?(.*)$/);
    if(qm){fp();fl();ql.push(qm[1]);continue;}
    fq();
    const um=t.match(/^[-*]\s+(.+)$/);
    if(um){fp();if(lt&&lt!=="ul")fl();lt="ul";li.push(um[1]);continue;}
    const om=t.match(/^\d+\.\s+(.+)$/);
    if(om){fp();if(lt&&lt!=="ol")fl();lt="ol";li.push(om[1]);continue;}
    fl(); para.push(t);
  }
  if(inCode)fc(); fp();fl();fq(); return out.join("");
}

// ── adjacency ──
function buildAdjacency(edges) {
  const adj = new Map();
  for(const n of rawNodes) adj.set(n.id, new Set());
  for(const e of edges) {
    if(!adj.has(e.from)) adj.set(e.from, new Set());
    if(!adj.has(e.to)) adj.set(e.to, new Set());
    adj.get(e.from).add(e.to);
    adj.get(e.to).add(e.from);
  }
  return adj;
}

// ── filters ──
function getEdgeState() {
  const mc = parseInt(controls.confSlider.value,10)/100;
  controls.confValue.textContent = mc.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf: mc,
  };
}
function passesFilter(edge, st) {
  const tok = (edge.type==="EXTRACTED"&&st.showExtracted)||(edge.type==="INFERRED"&&st.showInferred)||(edge.type==="AMBIGUOUS"&&st.showAmbiguous);
  return tok && (edge.confidence??1.0) >= st.minConf;
}

// ── community centers ──
function getCommunityCenters(nodes) {
  const groups = {};
  nodes.forEach(n => {
    const g = n.group ?? -1;
    if(g >= 0) { if(!groups[g]) groups[g]=[]; groups[g].push(n.id); }
  });
  const keys = Object.keys(groups).sort((a,b)=>a-b);
  const count = keys.length || 1;
  const radius = Math.max(200, nodes.length * 12);
  const centers = {};
  keys.forEach((g,i) => {
    const angle = (2*Math.PI*i)/count - Math.PI/2;
    centers[g] = { x: Math.cos(angle)*radius, y: Math.sin(angle)*radius };
  });
  return centers;
}

// ── graph ──
let filteredLinks = [];
let adjacency = new Map();

function filterData() {
  const es = getEdgeState();
  const lower = searchTerm.trim().toLowerCase();
  filteredLinks = rawEdges.filter(e => passesFilter(e, es));
  adjacency = buildAdjacency(filteredLinks);
  const connectedNodeIds = new Set();
  filteredLinks.forEach(e => { connectedNodeIds.add(e.from); connectedNodeIds.add(e.to); });
  const relatedIds = activeNodeId
    ? new Set([activeNodeId, ...(adjacency.get(activeNodeId)||[])])
    : null;
  let visCount = 0;
  const nodes = rawNodes.map(n => {
    const matchSearch = !lower || n.label.toLowerCase().includes(lower);
    const connected = connectedNodeIds.has(n.id);
    const related = !relatedIds || relatedIds.has(n.id);
    const active = activeNodeId === n.id;
    const visible = connected || !!lower || activeNodeId;
    const emphasized = matchSearch && related && visible;
    if(visible) visCount++;
    return { ...n, _visible: visible, _emphasized: emphasized, _active: active };
  });
  const links = filteredLinks.map(e => {
    const matchSearch = !lower
      || nodeMap.get(e.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(e.to)?.label.toLowerCase().includes(lower);
    const related = !relatedIds || relatedIds.has(e.from) || relatedIds.has(e.to);
    const touchesActive = !!activeNodeId && (e.from===activeNodeId||e.to===activeNodeId);
    return { ...e, _match: matchSearch && related, _touchesActive: touchesActive };
  });
  return { nodes, links, visCount, linkCount: filteredLinks.length };
}

function rebuild() {
  const { nodes, links, visCount, linkCount } = filterData();
  const centers = getCommunityCenters(nodes);
  const tc = themeColors();

  const gNodes = nodes.map(n => ({
    id: n.id, label: n.label, color: n.color, type: n.type,
    group: n.group, path: n.path, markdown: n.markdown,
    val: n._active ? 12 : n._emphasized ? 6 : 3,
    _visible: n._visible, _emphasized: n._emphasized, _active: n._active,
  }));
  const gLinks = links.map(l => ({
    source: l.from, target: l.to, type: l.type, confidence: l.confidence,
    color: l.color, _match: l._match, _touchesActive: l._touchesActive,
  }));

  if(!graph) {
    graph = new ForceGraph(document.getElementById("graph"))
      .graphData({ nodes: gNodes, links: gLinks })
      .backgroundColor(tc.canvasBg)
      .nodeRelSize(3).nodeId("id").nodeLabel(n => n.label)
      .nodeVisibility(n => n._visible).nodeVal(n => n.val)
      .nodeColor(n => {
        if(n._active || n._emphasized) return n.color;
        const [r,g,b] = hexToRgb(n.color);
        return `rgba(${r},${g},${b},0.12)`;
      })
      .nodeCanvasObjectMode(() => "after")
      .nodeCanvasObject((node, ctx, globalScale) => {
        if(!node._visible || !isFinite(node.x) || !isFinite(node.y)) return;
        const [r,g,b] = hexToRgb(node.color);
        const fontSize = Math.max(10/globalScale, 2.5);
        // active: bright ring + outer glow
        if(node._active) {
          const ringR = 10/globalScale;
          ctx.beginPath(); ctx.arc(node.x, node.y, ringR, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(${r},${g},${b},0.9)`;
          ctx.lineWidth = 2.5/globalScale;
          ctx.stroke();
          const gs = Math.max(22/globalScale, 1);
          const grad = ctx.createRadialGradient(node.x, node.y, ringR, node.x, node.y, gs);
          grad.addColorStop(0, `rgba(${r},${g},${b},0.25)`);
          grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(node.x, node.y, gs, 0, 2*Math.PI); ctx.fill();
        }
        // emphasized (neighbor): subtle ring
        else if(node._emphasized) {
          const ringR = 8/globalScale;
          ctx.beginPath(); ctx.arc(node.x, node.y, ringR, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(${r},${g},${b},0.4)`;
          ctx.lineWidth = 1.5/globalScale;
          ctx.stroke();
        }
        // label bg + text
        ctx.font = `${node._active?'700':node._emphasized?'600':'400'} ${fontSize}px 'Nunito Sans',sans-serif`;
        const tw = ctx.measureText(node.label).width;
        const pad = 2.5/globalScale;
        ctx.fillStyle = node._active ? (isDark?"rgba(15,17,23,0.9)":"rgba(245,242,235,0.92)")
                       : node._emphasized ? (isDark?"rgba(15,17,23,0.8)":"rgba(245,242,235,0.85)")
                       : (isDark?"rgba(15,17,23,0.6)":"rgba(245,242,235,0.65)");
        ctx.fillRect(node.x-tw/2-pad, node.y+6/globalScale-pad, tw+pad*2, fontSize+pad*2);
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillStyle = node._active ? (isDark?"#ffffff":"#2C3E3A")
                       : node._emphasized ? (isDark?"rgba(255,255,255,0.85)":"rgba(44,62,58,0.85)")
                       : (isDark?"rgba(255,255,255,0.25)":"rgba(44,62,58,0.2)");
        ctx.fillText(node.label, node.x, node.y+6/globalScale);
      })
      .linkVisibility(l => l._touchesActive || l._match)
      .linkColor(l => {
        if(l._touchesActive) return `rgba(${hexToRgb(nodeMap.get(activeNodeId)?.color||"#4dabf7").join(",")},0.7)`;
        if(l._match && activeNodeId) return isDark ? "rgba(255,255,255,0.04)" : "rgba(44,62,58,0.06)";
        return isDark ? "rgba(255,255,255,0.25)" : "rgba(44,62,58,0.28)";
      })
      .linkWidth(l => l._touchesActive ? 2 : 0.5)
      .linkCurvature(0.05)
      .linkDirectionalArrowLength(l => l._touchesActive ? 5 : l._match ? 4 : 0)
      .linkDirectionalArrowColor(l => l._touchesActive ? `rgba(${hexToRgb(nodeMap.get(activeNodeId)?.color||"#4dabf7").join(",")},0.6)` : tc.linkArrow)
      .linkDirectionalParticles(l => l._touchesActive ? 3 : 0)
      .linkDirectionalParticleWidth(3)
      .linkDirectionalParticleColor(l => nodeMap.get(activeNodeId)?.color || "#4dabf7")
      .linkDirectionalParticleSpeed(0.008)
      .onNodeClick(n => { if(n) focusNode(n.id); else clearSelection(); })
      .onBackgroundClick(() => clearSelection())
      .d3AlphaDecay(0.02).d3VelocityDecay(0.3)
      .d3Force("charge", null).d3Force("center", null)
      .d3Force("community", function(alpha) {
        const ns = graph.graphData().nodes;
        const groupMembers = {};
        ns.forEach(n => {
          const g = n.group ?? -1;
          if(g >= 0) { if(!groupMembers[g]) groupMembers[g]=[]; groupMembers[g].push(n); }
        });
        ns.forEach(node => {
          const c = centers[node.group];
          if(c && isFinite(node.x) && isFinite(node.y)) {
            node.vx += (c.x-node.x)*0.18*alpha;
            node.vy += (c.y-node.y)*0.18*alpha;
          }
        });
        // inter-community repulsion: push different communities apart
        const gKeys = Object.keys(groupMembers);
        for(let i=0;i<gKeys.length;i++) for(let j=i+1;j<gKeys.length;j++) {
          const ci=centers[gKeys[i]], cj=centers[gKeys[j]];
          if(!ci||!cj) continue;
          let dx=cj.x-ci.x, dy=cj.y-ci.y, d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d<350) {
            const f=(350-d)/d*0.08*alpha;
            groupMembers[gKeys[i]].forEach(n => { n.vx -= dx*f*0.5; n.vy -= dy*f*0.5; });
            groupMembers[gKeys[j]].forEach(n => { n.vx += dx*f*0.5; n.vy += dy*f*0.5; });
          }
        }
      })
      .d3Force("repulsion", function(alpha) {
        const ns = graph.graphData().nodes;
        for(let i=0;i<ns.length;i++) for(let j=i+1;j<ns.length;j++) {
          const a=ns[i],b=ns[j];
          if(!isFinite(a.x)||!isFinite(b.x)) continue;
          let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
          const minDist = a.group===b.group ? 40 : 80;
          if(d<minDist) { const f=(minDist-d)/d*0.35*alpha; a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f; }
        }
      })
      .warmupTicks(80).cooldownTime(6000)
      .onEngineStop(() => graph.zoomToFit(400, 40, n => n._visible));
  } else {
    graph.graphData({ nodes: gNodes, links: gLinks }).backgroundColor(tc.canvasBg);
    graph.d3Force("community", function(alpha) {
      const ns = graph.graphData().nodes;
      const groupMembers = {};
      ns.forEach(n => {
        const g = n.group ?? -1;
        if(g >= 0) { if(!groupMembers[g]) groupMembers[g]=[]; groupMembers[g].push(n); }
      });
      ns.forEach(node => {
        const c = centers[node.group];
        if(c && isFinite(node.x) && isFinite(node.y)) {
          node.vx += (c.x-node.x)*0.18*alpha;
          node.vy += (c.y-node.y)*0.18*alpha;
        }
      });
      const gKeys = Object.keys(groupMembers);
      for(let i=0;i<gKeys.length;i++) for(let j=i+1;j<gKeys.length;j++) {
        const ci=centers[gKeys[i]], cj=centers[gKeys[j]];
        if(!ci||!cj) continue;
        let dx=cj.x-ci.x, dy=cj.y-ci.y, d=Math.sqrt(dx*dx+dy*dy)||1;
        if(d<350) {
          const f=(350-d)/d*0.08*alpha;
          groupMembers[gKeys[i]].forEach(n => { n.vx -= dx*f*0.5; n.vy -= dy*f*0.5; });
          groupMembers[gKeys[j]].forEach(n => { n.vx += dx*f*0.5; n.vy += dy*f*0.5; });
        }
      }
    });
    graph.d3ReheatSimulation();
  }

  const focusSuffix = activeNodeId && nodeMap.get(activeNodeId) ? ` · ${nodeMap.get(activeNodeId).label}` : "";
  statsEl.textContent = `${visCount} 个节点 · ${linkCount} 条边${focusSuffix}`;
  if(activeNodeId) {
    const an = nodeMap.get(activeNodeId);
    if(an) openDrawer(an, new Set([activeNodeId, ...(adjacency.get(activeNodeId)||[])]));
  }
}

// ── interactions ──
function searchNodes(q) { searchTerm = q; rebuild(); }
function clearSelection() {
  activeNodeId = null;
  document.getElementById("drawer").classList.remove("open");
  rebuild();
}
function focusNode(id) {
  activeNodeId = id;
  const node = nodeMap.get(id);
  if(!node) return;
  openDrawer(node, new Set([id, ...(adjacency.get(id)||[])]));
  rebuild();
  setTimeout(() => {
    const n = graph.graphData().nodes.find(n => n.id===id);
    if(n && n.x != null) { graph.centerAt(n.x, n.y, 400); graph.zoom(1.8, 400); }
  }, 100);
}
function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const ct = Number.isInteger(node.group) && node.group >= 0 ? ` · 社区 ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${ct}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");
  const list = document.getElementById("drawer-related-list");
  list.innerHTML = "";
  const related = rawNodes.filter(n => relatedIds.has(n.id) && n.id !== node.id).sort((a,b) => a.label.localeCompare(b.label));
  if(!related.length) {
    const s = document.createElement("span"); s.textContent = "没有直接相连的节点";
    s.style.color = "var(--muted)"; list.appendChild(s); return;
  }
  for(const r of related) {
    const chip = document.createElement("button");
    chip.className = "related-chip"; chip.textContent = r.label;
    chip.onclick = () => focusNode(r.id); list.appendChild(chip);
  }
}

rebuild();
</script>
