<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识图谱 · 工作知识库</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Graph page specific styles */
    .graph-layout {
      position: relative;
      height: calc(100vh - 56px);
      overflow: hidden;
    }
    .graph-canvas {
      background: var(--bg-page);
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .graph-canvas__svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .graph-canvas__svg:active { cursor: grabbing; }
    .graph-toolbar {
      position: absolute;
      top: var(--space-5);
      left: var(--space-5);
      right: var(--space-5);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }
    .graph-toolbar > * { pointer-events: auto; }
    .graph-toolbar__title {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3) var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .graph-toolbar__actions {
      display: flex;
      gap: var(--space-2);
    }
    .graph-legend {
      position: absolute;
      bottom: var(--space-5);
      left: var(--space-5);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3) var(--space-4);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      z-index: 2;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 11px;
      color: var(--ink-muted);
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .node-circle {
      cursor: pointer;
      transition: all 200ms ease-out;
    }
    .node-circle:hover {
      filter: brightness(1.1);
    }
    .node-label {
      font-family: var(--font-serif);
      font-size: 11px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
    }
    .node--dim { opacity: 0.25; }
    .edge-line {
      stroke: var(--border);
      stroke-width: 1;
      fill: none;
      transition: stroke 200ms;
    }
    .edge-line--active {
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    /* Right drawer - node detail (slides in from right) */
    .node-detail {
      position: absolute;
      top: 0;
      right: 0;
      width: 340px;
      height: 100%;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
      padding: var(--space-6) var(--space-5);
      overflow-y: auto;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .node-detail.is-open {
      transform: translateX(0);
    }
    .node-detail__close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm, 4px);
      background: var(--bg-page);
      cursor: pointer;
      font-size: 14px;
      color: var(--ink-muted);
      transition: background 150ms;
    }
    .node-detail__close:hover {
      background: var(--bg-hover, #f0ede6);
    }
    .node-detail__empty {
      color: var(--ink-faint);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: center;
      padding-top: var(--space-7);
      line-height: 1.8;
    }
    .node-detail__field {
      margin-bottom: var(--space-4);
    }
    .node-detail__label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
      margin-bottom: var(--space-1);
    }
    .node-detail__value {
      font-size: 13px;
      color: var(--ink);
    }
    .node-detail__value--mono {
      font-family: var(--font-mono);
      color: var(--accent);
    }

    /* Backdrop overlay when drawer is open */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.08);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 280ms ease;
    }
    .drawer-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ========== Header ========== -->
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__title">工 作 知 识 库</span>
      <span class="app-header__subtitle">editorial · v1.0</span>
    </div>
    <div class="app-header__actions">
      <a href="search.html" class="kbd-search">
        <kbd>⌘</kbd><kbd>K</kbd>
        <span>搜索</span>
      </a>
      <div class="settings-wrap">
        <button class="icon-btn" id="settings-btn" title="设置">⚙</button>
      </div>
    </div>
  </header>

  <!-- ========== Sidebar ========== -->
  <aside class="app-sidebar" id="sidebar"></aside>

  <!-- ========== Main: 知识图谱 ========== -->
  <main class="app-main" style="padding: 0;">
    <div class="graph-layout">

      <!-- 图谱画布 -->
      <div class="graph-canvas">
        <svg class="graph-canvas__svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
          <!-- Edges -->
          <g class="edges">
            <line class="edge-line" x1="400" y1="240" x2="200" y2="340" />
            <line class="edge-line" x1="400" y1="240" x2="600" y2="340" />
            <line class="edge-line" x1="400" y1="240" x2="300" y2="480" />
            <line class="edge-line" x1="400" y1="100" x2="400" y2="240" />
            <line class="edge-line" x1="400" y1="100" x2="200" y2="340" />
            <line class="edge-line" x1="750" y1="180" x2="850" y2="380" />
            <line class="edge-line" x1="150" y1="150" x2="600" y2="340" />
          </g>

          <!-- Nodes -->
          <g class="nodes">
            <!-- IAP系统综合 (synthesis, n5) - 顶部中央 -->
            <g class="node-group" data-id="n5">
              <polygon class="node-circle" points="400,75 425,90 425,115 400,130 375,115 375,90"
                fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
              <text class="node-label" x="400" y="155" font-weight="600">IAP系统综合</text>
            </g>

            <!-- IAP退款 (source, n1) - 中央琥珀色 -->
            <g class="node-group" data-id="n1">
              <circle class="node-circle" cx="400" cy="240" r="22" fill="#B45309" stroke="#78350F" stroke-width="2"/>
              <text class="node-label" x="400" y="280" font-weight="600">IAP退款</text>
            </g>

            <!-- PaymentSystem (entity, n2) -->
            <g class="node-group" data-id="n2">
              <rect class="node-circle" x="170" y="318" width="60" height="44" rx="4"
                fill="#F5F2EB" stroke="#1C1917" stroke-width="1.5"/>
              <text class="node-label" x="200" y="345">Payment</text>
              <text class="node-label" x="200" y="358" font-size="9" fill="#57534E">System</text>
            </g>

            <!-- UserCenter (entity, n3) -->
            <g class="node-group" data-id="n3">
              <rect class="node-circle" x="570" y="318" width="60" height="44" rx="4"
                fill="#F5F2EB" stroke="#1C1917" stroke-width="1.5"/>
              <text class="node-label" x="600" y="345">User</text>
              <text class="node-label" x="600" y="358" font-size="9" fill="#57534E">Center</text>
            </g>

            <!-- RefundPolicy (concept, n4) -->
            <g class="node-group" data-id="n4">
              <polygon class="node-circle" points="300,458 322,480 300,502 278,480"
                fill="#EFEAE0" stroke="#57534E" stroke-width="1.5"/>
              <text class="node-label" x="300" y="525" font-size="10">RefundPolicy</text>
            </g>

            <!-- 投放策略 (source, n6) -->
            <g class="node-group" data-id="n6">
              <circle class="node-circle" cx="750" cy="180" r="20" fill="#B45309" stroke="#78350F" stroke-width="2"/>
              <text class="node-label" x="750" y="218" font-weight="600">投放策略</text>
            </g>

            <!-- AdChannel (concept, n7) -->
            <g class="node-group" data-id="n7">
              <polygon class="node-circle" points="850,358 872,380 850,402 828,380"
                fill="#EFEAE0" stroke="#57534E" stroke-width="1.5"/>
              <text class="node-label" x="850" y="425" font-size="10">AdChannel</text>
            </g>

            <!-- 钉钉自动化 (source, n8) -->
            <g class="node-group" data-id="n8">
              <circle class="node-circle" cx="150" cy="150" r="18" fill="#B45309" stroke="#78350F" stroke-width="2"/>
              <text class="node-label" x="150" y="185" font-size="10">钉钉自动化</text>
            </g>
          </g>
        </svg>

        <!-- 工具栏 -->
        <div class="graph-toolbar">
          <div class="graph-toolbar__title">
            <div class="text-meta">03 — KNOWLEDGE GRAPH</div>
            <div class="h2" style="margin-top: 4px;">知识图谱</div>
            <div class="text-meta" style="margin-top: 6px;">8 节点 · 7 边</div>
          </div>
          <div class="graph-toolbar__actions">
            <button class="icon-btn" title="刷新">⟳</button>
            <button class="icon-btn" title="全屏">⛶</button>
            <button class="icon-btn" title="导出">⬇</button>
          </div>
        </div>

        <!-- 图例 -->
        <div class="graph-legend">
          <div class="legend-row">
            <span class="legend-dot" style="background: #B45309;"></span>
            <span>源 Source</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot" style="background: #F5F2EB; border: 1px solid #1C1917;"></span>
            <span>实体 Entity</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot" style="background: #EFEAE0; border: 1px solid #57534E; transform: rotate(45deg);"></span>
            <span>概念 Concept</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot" style="background: #FFFFFF; border: 2px solid #B45309;"></span>
            <span>综合 Synthesis</span>
          </div>
        </div>
      </div>

      <!-- 点击空白关闭抽屉的遮罩 -->
      <div class="drawer-backdrop" id="drawer-backdrop"></div>

      <!-- 节点详情面板（右侧抽屉） -->
      <aside class="node-detail" id="node-detail">
        <button class="node-detail__close" id="detail-close" title="关闭">✕</button>

        <div class="text-meta mb-4" style="padding-right: 32px;">NODE DETAIL</div>

        <div class="node-detail__field">
          <div class="node-detail__label">名称</div>
          <div class="h2" id="detail-name">IAP退款</div>
        </div>

        <div class="node-detail__field">
          <div class="node-detail__label">类型</div>
          <div><span class="type-badge type-badge--source" id="detail-type">source</span></div>
        </div>

        <div class="node-detail__field">
          <div class="node-detail__label">入度 / 出度</div>
          <div class="node-detail__value">
            <span class="node-detail__value--mono" id="detail-in">1</span> 入 /
            <span class="node-detail__value--mono" id="detail-out">3</span> 出
          </div>
        </div>

        <div class="divider divider--dashed"></div>

        <div class="node-detail__field">
          <div class="node-detail__label">关联节点（出边）</div>
          <div class="flex flex-col gap-2" id="detail-outgoing">
            <a href="documents.html" class="text-body" style="font-size: 13px;">
              <span class="num-badge">→</span> PaymentSystem
            </a>
            <a href="documents.html" class="text-body" style="font-size: 13px;">
              <span class="num-badge">→</span> UserCenter
            </a>
            <a href="documents.html" class="text-body" style="font-size: 13px;">
              <span class="num-badge">→</span> RefundPolicy
            </a>
          </div>
        </div>

        <div class="node-detail__field">
          <div class="node-detail__label">被引用（入边）</div>
          <div class="flex flex-col gap-2" id="detail-incoming">
            <a href="documents.html" class="text-body" style="font-size: 13px;">
              <span class="num-badge">←</span> IAP系统综合分析
            </a>
          </div>
        </div>

        <div class="divider divider--dashed"></div>

        <a href="documents.html" class="btn btn--primary" style="width: 100%; justify-content: center;">
          查看完整文档 →
        </a>
      </aside>

    </div>
  </main>
</div>

<script src="assets/mock-data.js"></script>
<script src="assets/sidebar.js"></script>
<script src="assets/settings.js"></script>

<script>
(function () {
  const drawer   = document.getElementById('node-detail');
  const backdrop = document.getElementById('drawer-backdrop');
  const closeBtn = document.getElementById('detail-close');

  /* ---- open / close helpers ---- */
  function openDrawer() {
    drawer.classList.add('is-open');
    backdrop.classList.add('is-visible');
  }
  function closeDrawer() {
    drawer.classList.remove('is-open');
    backdrop.classList.remove('is-visible');
    /* remove active highlight and dim from all nodes */
    document.querySelectorAll('.node-group').forEach(g => {
      g.classList.remove('node--active');
      g.classList.remove('node--dim');
    });
    /* reset edge opacity */
    document.querySelectorAll('.edge-line').forEach(line => {
      line.style.opacity = '';
    });
  }

  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  /* ---- node click → open drawer ---- */
  document.querySelectorAll('.node-group').forEach(group => {
    group.addEventListener('click', function (e) {
      e.stopPropagation();

      /* highlight active node */
      document.querySelectorAll('.node-group').forEach(g => g.classList.remove('node--active'));
      this.classList.add('node--active');

      /* dim unrelated nodes (optional polish) */
      const activeId = this.dataset.id;
      document.querySelectorAll('.node-group').forEach(g => {
        if (g !== this) g.classList.add('node--dim');
        else g.classList.remove('node--dim');
      });
      /* highlight connected edges */
      document.querySelectorAll('.edge-line').forEach(line => {
        line.classList.remove('edge-line--active');
        line.style.opacity = '0.25';
      });

      /* update detail panel fields from the clicked node */
      const nameEl  = group.querySelector('.node-label');
      if (nameEl) document.getElementById('detail-name').textContent = nameEl.textContent.trim();

      /* open the drawer */
      openDrawer();
    });
  });

  /* ESC key closes drawer */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
  });
})();
</script>

</body>
</html>
