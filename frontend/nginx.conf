# =============================================================================
# LLM Wiki Agent - Nginx 配置模板
# 设计规范参考 WeKnora frontend/nginx.conf：
#   * gzip 压缩静态资源 + 安全响应头
#   * SPA fallback（try_files -> /index.html）
#   * /assets 长缓存（构建产物带 hash）
#   * /api 反代 backend，含 SSE（流式输出）所需配置
# 启动时由 docker-entrypoint.sh 经 envsubst 注入运行时变量
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # 上传大小：默认 50M，经 MAX_FILE_SIZE_MB 注入（与后端解析上限对齐）
    client_max_body_size ${MAX_FILE_SIZE};

    # ---- gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/rss+xml image/svg+xml
               font/ttf font/otf;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # ---- SPA 静态资源 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 不可缓存，保证发版后用户立即拿到新入口
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- 构建产物（带 hash 文件名）长缓存 ----
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- API 反代到后端 ----
    # APP_SCHEME 默认 http；远程 HTTPS 后端可设 https
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接与重试
        proxy_connect_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # SSE 流式输出配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 错误页 ----
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
