[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-backend"
version = "0.1.0"
description = "LLM Wiki 3.0 backend - RAG foundation (MVP P1 batch 1)"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "LLM Wiki Team" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "openai>=1.6.0",
    "minio>=7.2.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "playwright>=1.55.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.14.0",
    "markdownify>=0.13.1",
    "lxml>=6.0.0",
    "ebooklib>=0.18",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "taskiq>=0.12.4,<0.13",
    "taskiq-redis>=1.2.3,<2",
]

[project.optional-dependencies]
advanced = [
    "markitdown[docx,pdf,xls,xlsx]>=0.1.3",
    "opendataloader-pdf>=2.4.7",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.0.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "xlwt>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
